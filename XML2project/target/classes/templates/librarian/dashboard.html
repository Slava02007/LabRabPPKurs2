<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Панель Библиотекаря</title>
    <style>table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }</style>
</head>
<body>
<h1>Управление Библиотекой</h1>
<nav>
    <a href="/librarian/dashboard">Книги</a> |
    <a href="/librarian/users">Читатели</a> |
    <form th:action="@{/logout}" method="post" style="display:inline;"><button>Выход</button></form>
</nav>

<h3>Добавление книги</h3>
<form th:action="@{/librarian/add}" th:object="${newBook}" method="post">
    <input type="text" th:field="*{title}" placeholder="Название" required/>
    <input type="text" th:field="*{author}" placeholder="Автор" required/>
    <input type="text" th:field="*{year}" placeholder="Год" required/>
    <input type="text" th:field="*{category}" placeholder="Категория" required/>
    <input type="number" step="0.1" th:field="*{price}" placeholder="Цена" required/>
    <input type="number" th:field="*{count}" placeholder="Кол-во" required/>
    <button type="submit">Добавить</button>
</form>

<h3>Список книг</h3>
<table>
    <thead>
    <tr>
        <th>Название</th><th>Автор</th><th>Год</th><th>Цена</th><th>Остаток</th><th>Изменить цену</th><th>Выдать</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.year}"></td>
        <td th:text="${book.price}"></td>
        <td th:text="${book.count}"></td>
        <td>
            <form th:action="@{/librarian/updatePrice}" method="post">
                <input type="hidden" name="id" th:value="${book.id}"/>
                <input type="number" step="0.1" name="price" style="width:60px" required/>
                <button type="submit">OK</button>
            </form>
        </td>
        <td>
            <form th:action="@{/librarian/issue}" method="post" th:if="${book.count > 0}">
                <input type="hidden" name="bookId" th:value="${book.id}"/>
                <input type="text" name="username" placeholder="Логин юзера" style="width:100px" required/>
                <button type="submit">Выдать</button>
            </form>
            <span th:if="${book.count == 0}" style="color:red">Нет в наличии</span>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
